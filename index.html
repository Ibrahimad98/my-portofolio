<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ibrahim Adam — Portfolio</title>
    <script>
      // Apply theme before paint to avoid a flash of the wrong theme.
      (function () {
        try {
          var stored = localStorage.getItem('portfolio-theme')
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches
          if (dark) document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app">
      <!--
        Painted instantly, before Vue mounts, so a refresh never flashes bare
        white. It MUST be the same mark as SplashScreen.vue and BrandLoader.vue:
        this used to be a stroked hexagon, which meant every refresh briefly
        showed a loader from a design the site no longer uses.

        Colours key off the `.dark` class the script above already applied — NOT
        prefers-color-scheme. The site's theme comes from localStorage, so the OS
        preference is the wrong signal and got it backwards for anyone whose
        chosen theme differs from their system one.
      -->
      <style>
        .pre-splash {
          position: fixed;
          inset: 0;
          z-index: 50;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #fff;
          --pre-ink: #000;
          --pre-paper: #fff;
        }
        .dark .pre-splash {
          background: #0a0a0a;
          --pre-ink: #fafafa;
          --pre-paper: #0a0a0a;
        }
        .pre-mark {
          position: relative;
          width: 80px;
          height: 80px;
          border: 1px solid var(--pre-ink);
          background: var(--pre-paper);
          overflow: hidden;
        }
        .pre-fill {
          position: absolute;
          inset: 0;
          background: var(--pre-ink);
          transform-origin: bottom;
          transform: scaleY(0);
          animation: pre-fill 1.8s cubic-bezier(0.65, 0, 0.35, 1) infinite;
        }
        .pre-initials {
          position: absolute;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          font: 500 24px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
          letter-spacing: -0.02em;
          color: #fff;
          mix-blend-mode: difference;
        }
        .pre-tick {
          position: absolute;
          top: 0;
          right: 0;
          width: 8px;
          height: 8px;
          background: var(--pre-ink);
        }
        @keyframes pre-fill {
          0% { transform: scaleY(0); }
          70% { transform: scaleY(0.85); }
          100% { transform: scaleY(0); }
        }
        @media (prefers-reduced-motion: reduce) {
          .pre-fill { animation: none; transform: scaleY(0.6); }
        }
      </style>
      <div class="pre-splash">
        <div class="pre-mark">
          <span class="pre-fill"></span>
          <span class="pre-initials">IA</span>
          <span class="pre-tick"></span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
